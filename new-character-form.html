<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register TRAINER Information</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			color: #222;
			background: #f5f3ff;
		}
		nav {
			display: flex;
			gap: 1.5rem;
			padding: 1rem 7%;
			background: #222;
		}
		nav a {
			color: #fff;
			text-decoration: none;
		}
		nav a:hover, nav a:focus { color: #c8ffe8; text-decoration: underline; }
		main {
			max-width: 650px;
			margin: 2rem auto;
			padding: 2rem;
			background: #fff;
			border-radius: 8px;
			box-shadow: 0 2px 8px #0002;
		}
		h1 { margin-top: 0; }
		label {
			display: block;
			margin-top: 1rem;
			font-weight: bold;
		}
		input, textarea {
			width: 100%;
			margin-top: .4rem;
			padding: .75rem;
			border: 1px solid #aaa;
			border-radius: 4px;
			font: inherit;
		}
		textarea { min-height: 120px; resize: vertical; }
		button {
			margin-top: 1.5rem;
			padding: .75rem 1.25rem;
			border: 0;
			border-radius: 4px;
			color: #fff;
			background: #2563eb;
			font-weight: bold;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
	</style>
</head>
<body>
	<nav aria-label="Main navigation">
		<a href="index.html">Home</a>
		<a href="details.html">Details</a>
		<a href="about.html">About</a>
		<a href="new-character-form.html">Register TRAINER Information</a>
	</nav>

	<main>
		<h1>Add a New TRAINER</h1>
		<p>Register your TRAINER information for the gallery.</p>
		<form action="#" method="post">
			<label for="name">Name</label>
			<input type="text" id="name" name="name" required>

			<label for="strategy">Strategy</label>
			<textarea id="strategy" name="strategy" required></textarea>

			<label for="favorite-pokemon">Favorite POKéMON</label>
			<input type="text" id="favorite-pokemon" name="favorite-pokemon" required>

			<label for="trainer-message">TRAINER Message</label>
			<textarea id="trainer-message" name="trainer-message" required></textarea>

			<button type="submit">Add Character</button>
		</form>
	</main>
</body>
</html>
